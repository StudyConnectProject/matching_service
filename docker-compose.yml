version: '3.8'

services:
  matching_service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: matching_service
    environment:
      APP_PORT: 8084
      DB_HOST: ep-old-cherry-ap5tf8fm-pooler.c-7.us-east-1.aws.neon.tech
      DB_PORT: 5432
      DB_USER: neondb_owner
      DB_PASSWORD: npg_pZdjels9D6CA
      DB_NAME: neondb
      DB_SSLMODE: require
      DB_POOL_MAX: 10
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-http://notification-service/internal/events}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8084:8084"
    networks:
      - studyconnect
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: matching_service_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@studyconnect.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on: []
    networks:
      - studyconnect
    profiles:
      - debug

networks:
  studyconnect:
    driver: bridge
